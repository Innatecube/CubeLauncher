<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="100%" height="100%">
  <defs>
    <linearGradient id="bgShd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090514"/>
      <stop offset="50%" stop-color="#140a28"/>
      <stop offset="100%" stop-color="#06030e"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="btnShd" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glowShd" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="480" height="270" fill="url(#bgShd)"/>

  <!-- Orbs -->
  <circle cx="90" cy="140" r="80" fill="rgba(168, 85, 247, 0.12)" filter="url(#glowShd)"/>

  <!-- Border & Frame -->
  <rect x="6" y="6" width="468" height="258" fill="none" stroke="rgba(168, 85, 247, 0.3)" stroke-width="1.5"/>

  <!-- Corner Brackets -->
  <path d="M 12 28 L 12 12 L 28 12" fill="none" stroke="#c084fc" stroke-width="2.5"/>
  <path d="M 452 12 L 468 12 L 468 28" fill="none" stroke="#c084fc" stroke-width="2.5"/>
  <path d="M 12 242 L 12 258 L 28 258" fill="none" stroke="#c084fc" stroke-width="2.5"/>
  <path d="M 452 258 L 468 258 L 468 242" fill="none" stroke="#c084fc" stroke-width="2.5"/>

  <!-- Top Badges -->
  <rect x="22" y="20" width="100" height="20" fill="rgba(168, 85, 247, 0.2)" stroke="#a855f7" stroke-width="1"/>
  <text x="72" y="34" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="1.2" text-anchor="middle">LUMEN RTX</text>

  <rect x="356" y="20" width="102" height="20" fill="rgba(245, 158, 11, 0.18)" stroke="#f59e0b" stroke-width="1"/>
  <text x="407" y="34" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="1" text-anchor="middle">PRO GRAPHICS</text>

  <!-- Central Graphic: Isometric Glowing Crystal -->
  <g transform="translate(90, 145)">
    <polygon points="0,-50 38,-6 0,40 -38,-6" fill="#a855f7" opacity="0.85"/>
    <polygon points="0,-50 38,-6 0,0" fill="#c084fc" opacity="0.95"/>
    <polygon points="0,0 38,-6 0,40" fill="#7c3aed"/>
    <polygon points="0,0 -38,-6 0,40" fill="#6d28d9"/>
    <polygon points="0,-50 -38,-6 0,0" fill="#9333ea"/>
    <circle cx="0" cy="-6" r="10" fill="#f59e0b" filter="url(#glowShd)" opacity="0.8"/>
  </g>

  <!-- Typography Content -->
  <text x="175" y="78" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5">
    RAYTRACED SHADERS
  </text>
  <text x="175" y="100" fill="#c084fc" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" letter-spacing="0.3">
    NEXT-GEN LIGHTING &amp; TEXTURES
  </text>

  <!-- Bullets -->
  <g transform="translate(175, 118)" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#94a3b8">
    <circle cx="4" cy="5" r="3" fill="#c084fc"/>
    <text x="14" y="9" font-weight="600">RTX Realistic Water &amp; Reflections</text>
    <circle cx="4" cy="23" r="3" fill="#f59e0b"/>
    <text x="14" y="27" font-weight="600">Volumetric Clouds &amp; Atmospherics</text>
    <circle cx="4" cy="41" r="3" fill="#c084fc"/>
    <text x="14" y="45" font-weight="600">Optimized for 144+ FPS in Iris/OptiFine</text>
  </g>

  <!-- CTA Button -->
  <g transform="translate(175, 194)">
    <rect width="283" height="38" fill="url(#btnShd)" rx="0"/>
    <text x="141" y="24" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800" letter-spacing="0.8" text-anchor="middle">
      EXPLORE TEXTURE PACKS →
    </text>
  </g>

  <!-- Bottom Tag -->
  <text x="316" y="250" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">
    VERIFIED COMMUNITY CREATIONS
  </text>
</svg>