<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSkn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041210"/>
      <stop offset="50%" stop-color="#07201c"/>
      <stop offset="100%" stop-color="#030c0a"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="btnSkn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glowSkn" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="480" height="270" fill="url(#bgSkn)"/>

  <!-- Orbs -->
  <circle cx="90" cy="140" r="80" fill="rgba(16, 185, 129, 0.15)" filter="url(#glowSkn)"/>

  <!-- Border & Frame -->
  <rect x="6" y="6" width="468" height="258" fill="none" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.5"/>

  <!-- Corner Brackets -->
  <path d="M 12 28 L 12 12 L 28 12" fill="none" stroke="#10b981" stroke-width="2.5"/>
  <path d="M 452 12 L 468 12 L 468 28" fill="none" stroke="#10b981" stroke-width="2.5"/>
  <path d="M 12 242 L 12 258 L 28 258" fill="none" stroke="#10b981" stroke-width="2.5"/>
  <path d="M 452 258 L 468 258 L 468 242" fill="none" stroke="#10b981" stroke-width="2.5"/>

  <!-- Top Badges -->
  <rect x="22" y="20" width="106" height="20" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1"/>
  <text x="75" y="34" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="1.2" text-anchor="middle">SKIN STUDIO</text>

  <rect x="356" y="20" width="102" height="20" fill="rgba(0, 229, 255, 0.18)" stroke="#00e5ff" stroke-width="1"/>
  <text x="407" y="34" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="1" text-anchor="middle">FREE HD CAPES</text>

  <!-- Central Graphic: Isometric Minecraft Player Head / Cape -->
  <g transform="translate(90, 142)">
    <!-- Head Cube Top -->
    <polygon points="0,-45 35,-22 0,0 -35,-22" fill="#34d399" opacity="0.9"/>
    <!-- Head Cube Left -->
    <polygon points="-35,-22 0,0 0,40 -35,18" fill="#065f46"/>
    <!-- Eyes Left -->
    <rect x="-24" y="2" width="6" height="6" fill="#00e5ff"/>
    <!-- Head Cube Right -->
    <polygon points="0,0 35,-22 35,18 0,40" fill="#047857"/>
    <!-- Eyes Right -->
    <rect x="18" y="-10" width="6" height="6" fill="#00e5ff"/>
    <!-- Glowing Cape Flap -->
    <polygon points="-12,30 25,12 35,55 0,72" fill="#10b981" opacity="0.8"/>
    <!-- Core Glow -->
    <circle cx="0" cy="10" r="12" fill="#10b981" filter="url(#glowSkn)" opacity="0.8"/>
  </g>

  <!-- Typography Content -->
  <text x="175" y="78" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5">
    ELY.BY 3D WARDROBE
  </text>
  <text x="175" y="100" fill="#10b981" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" letter-spacing="0.3">
    CUSTOM SKINS &amp; ANIMATED CAPES
  </text>

  <!-- Bullets -->
  <g transform="translate(175, 118)" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#94a3b8">
    <circle cx="4" cy="5" r="3" fill="#10b981"/>
    <text x="14" y="9" font-weight="600">64x64 &amp; 128x128 HD Skins Library</text>
    <circle cx="4" cy="23" r="3" fill="#00e5ff"/>
    <text x="14" y="27" font-weight="600">Custom Elytra Wings &amp; Glowing Capes</text>
    <circle cx="4" cy="41" r="3" fill="#10b981"/>
    <text x="14" y="45" font-weight="600">1-Click Sync Directly to CubeLauncher</text>
  </g>

  <!-- CTA Button -->
  <g transform="translate(175, 194)">
    <rect width="283" height="38" fill="url(#btnSkn)" rx="0"/>
    <text x="141" y="24" fill="#022018" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800" letter-spacing="0.8" text-anchor="middle">
      BROWSE SKINS &amp; CAPES →
    </text>
  </g>

  <!-- Bottom Tag -->
  <text x="316" y="250" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">
    COMPATIBLE WITH CUBELAUNCHER V5.3
  </text>
</svg>