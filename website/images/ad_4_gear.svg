<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140804"/>
      <stop offset="50%" stop-color="#220d06"/>
      <stop offset="100%" stop-color="#0d0402"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b00"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="btnGear" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b00"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glowGear" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="480" height="270" fill="url(#bgGear)"/>

  <!-- Orbs -->
  <circle cx="90" cy="140" r="80" fill="rgba(255, 107, 0, 0.15)" filter="url(#glowGear)"/>

  <!-- Border & Frame -->
  <rect x="6" y="6" width="468" height="258" fill="none" stroke="rgba(255, 107, 0, 0.3)" stroke-width="1.5"/>

  <!-- Corner Brackets -->
  <path d="M 12 28 L 12 12 L 28 12" fill="none" stroke="#ff7b00" stroke-width="2.5"/>
  <path d="M 452 12 L 468 12 L 468 28" fill="none" stroke="#ff7b00" stroke-width="2.5"/>
  <path d="M 12 242 L 12 258 L 28 258" fill="none" stroke="#ff7b00" stroke-width="2.5"/>
  <path d="M 452 258 L 468 258 L 468 242" fill="none" stroke="#ff7b00" stroke-width="2.5"/>

  <!-- Top Badges -->
  <rect x="22" y="20" width="108" height="20" fill="rgba(255, 107, 0, 0.2)" stroke="#ff7b00" stroke-width="1"/>
  <text x="76" y="34" fill="#ff7b00" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="1.2" text-anchor="middle">OPTICAL GEAR</text>

  <rect x="356" y="20" width="102" height="20" fill="rgba(234, 88, 12, 0.2)" stroke="#ea580c" stroke-width="1"/>
  <text x="407" y="34" fill="#ffedd5" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="1" text-anchor="middle">0.1ms TRIGGER</text>

  <!-- Central Graphic: Isometric Mechanical Switch -->
  <g transform="translate(90, 142)">
    <!-- Switch Housing Base -->
    <polygon points="0,-40 38,-18 0,6 -38,-18" fill="#ff7b00" opacity="0.9"/>
    <polygon points="-38,-18 0,6 0,42 -38,18" fill="#7c2d12"/>
    <polygon points="0,6 38,-18 38,18 0,42" fill="#9a3412"/>
    <!-- Stem Key / Cross Top -->
    <rect x="-6" y="-30" width="12" height="18" fill="#fed7aa" opacity="0.95"/>
    <rect x="-14" y="-24" width="28" height="6" fill="#fed7aa" opacity="0.95"/>
    <!-- Glowing Contact Core -->
    <circle cx="0" cy="8" r="10" fill="#ff7b00" filter="url(#glowGear)" opacity="0.85"/>
  </g>

  <!-- Typography Content -->
  <text x="175" y="78" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5">
    VORTEX PRO SWITCH
  </text>
  <text x="175" y="100" fill="#ff7b00" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700" letter-spacing="0.3">
    8000Hz ULTRA-POLLING KEYBOARD
  </text>

  <!-- Bullets -->
  <g transform="translate(175, 118)" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" fill="#94a3b8">
    <circle cx="4" cy="5" r="3" fill="#ff7b00"/>
    <text x="14" y="9" font-weight="600">Hall-Effect Magnetic Rapid Trigger</text>
    <circle cx="4" cy="23" r="3" fill="#ea580c"/>
    <text x="14" y="27" font-weight="600">0.1mm - 4.0mm Adjustable Actuation</text>
    <circle cx="4" cy="41" r="3" fill="#ff7b00"/>
    <text x="14" y="45" font-weight="600">Built for Zero-Latency PvP &amp; Speed</text>
  </g>

  <!-- CTA Button -->
  <g transform="translate(175, 194)">
    <rect width="283" height="38" fill="url(#btnGear)" rx="0"/>
    <text x="141" y="24" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="800" letter-spacing="0.8" text-anchor="middle">
      UPGRADE YOUR SETUP →
    </text>
  </g>

  <!-- Bottom Tag -->
  <text x="316" y="250" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">
    ESPORTS GRADE • ZERO DELAY
  </text>
</svg>