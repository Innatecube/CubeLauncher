<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0714"/>
      <stop offset="50%" stop-color="#140a24"/>
      <stop offset="100%" stop-color="#07040d"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="480" height="600" fill="url(#bgGrad2)"/>

  <!-- Glowing Orbs -->
  <circle cx="240" cy="120" r="140" fill="rgba(168, 85, 247, 0.15)" filter="url(#glow2)"/>
  <circle cx="340" cy="450" r="120" fill="rgba(245, 158, 11, 0.1)" filter="url(#glow2)"/>

  <!-- Border -->
  <rect x="8" y="8" width="464" height="584" fill="none" stroke="rgba(168, 85, 247, 0.3)" stroke-width="2"/>

  <!-- Top Badge -->
  <rect x="28" y="28" width="130" height="24" fill="rgba(168, 85, 247, 0.2)" stroke="#a855f7" stroke-width="1"/>
  <text x="93" y="44" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">SPONSORED</text>

  <rect x="340" y="28" width="112" height="24" fill="rgba(245, 158, 11, 0.18)" stroke="#f59e0b" stroke-width="1"/>
  <text x="396" y="44" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">PRO GRAPHICS</text>

  <!-- Visual graphic: Isometric Glowing Crystal / Mod Gem -->
  <g transform="translate(240, 190)">
    <polygon points="0,-80 60,-10 0,60 -60,-10" fill="#a855f7" opacity="0.85"/>
    <polygon points="0,-80 60,-10 0,0" fill="#c084fc" opacity="0.95"/>
    <polygon points="0,0 60,-10 0,60" fill="#7c3aed"/>
    <polygon points="0,0 -60,-10 0,60" fill="#6d28d9"/>
    <polygon points="0,-80 -60,-10 0,0" fill="#9333ea"/>
    <circle cx="0" cy="-10" r="18" fill="#f59e0b" filter="url(#glow2)" opacity="0.8"/>
  </g>

  <!-- Text -->
  <text x="240" y="335" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="800" text-anchor="middle">
    RAYTRACED SHADERS
  </text>
  <text x="240" y="368" fill="#c084fc" font-family="'Space Grotesk', sans-serif" font-size="17" font-weight="700" text-anchor="middle">
    NEXT-GEN TEXTURES &amp; LIGHTING
  </text>

  <g transform="translate(60, 400)" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#cbd5e1">
    <circle cx="10" cy="6" r="4" fill="#a855f7"/>
    <text x="24" y="11" font-weight="600">RTX Realistic Water &amp; Reflections</text>

    <circle cx="10" cy="34" r="4" fill="#f59e0b"/>
    <text x="24" y="39" font-weight="600">Volumetric Clouds &amp; Atmospherics</text>

    <circle cx="10" cy="62" r="4" fill="#a855f7"/>
    <text x="24" y="67" font-weight="600">Optimized for 144+ FPS in Iris/OptiFine</text>
  </g>

  <!-- Button -->
  <g transform="translate(48, 510)">
    <rect width="384" height="52" fill="url(#purpleGrad)" rx="0"/>
    <text x="192" y="32" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="800" letter-spacing="1" text-anchor="middle">
      EXPLORE TEXTURE PACKS →
    </text>
  </g>

  <text x="240" y="580" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">
    VERIFIED COMMUNITY CREATIONS
  </text>
</svg>
